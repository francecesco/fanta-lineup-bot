services:
  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      TZ: Europe/Rome
    volumes:
      - ./.env:/app/.env:ro
      - ./config.py:/app/config.py:ro
      - ./rosa.xlsx:/app/rosa.xlsx:ro
      - ./Quotazioni_Fantacalcio_Stagione_2026_27.xlsx:/app/Quotazioni_Fantacalcio_Stagione_2026_27.xlsx:ro
      # bot.db va pre-creato sull'host (touch bot.db) prima del primo avvio: se il file non
      # esiste, Docker monta una directory al suo posto e sqlite3.connect() fallisce.
      - ./bot.db:/app/bot.db
