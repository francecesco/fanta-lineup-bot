services:
  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      TZ: Europe/Rome
    volumes:
      - ./.env:/app/.env:ro
      - ./config.py:/app/config.py:ro
      # Nessun file .xlsx: il bot ricava la rosa (nome→id) dai dati del sito (get_lineup).
      # Bastano credenziali (.env) e id lega (config.py).
      # bot.db va pre-creato sull'host (touch bot.db) prima del primo avvio: se il file non
      # esiste, Docker monta una directory al suo posto e sqlite3.connect() fallisce.
      - ./bot.db:/app/bot.db
